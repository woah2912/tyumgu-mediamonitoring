<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Медиамониторинг ТюмГУ{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/img/utmn-logo.svg" alt="ТюмГУ">
      <span class="brand-text">Медиамониторинг</span>
    </a>
    <nav>
      <p class="nav-group">Сотрудник УСК</p>
      <a href="/" class="{{ 'active' if active == 'new' }}">Новый отчёт</a>
      <a href="/reports" class="{{ 'active' if active == 'reports' }}">Архив отчётов</a>
      <p class="nav-group">Данные</p>
      <a href="/publications" class="{{ 'active' if active == 'publications' }}">Публикации</a>
      <a href="/sources" class="{{ 'active' if active == 'sources' }}">Источники и сбор</a>
      <a href="/objects" class="{{ 'active' if active == 'objects' }}">Объекты мониторинга</a>
      <p class="nav-group">Администрирование</p>
      <a href="/debug" class="{{ 'active' if active == 'debug' }}">Отладка сбора</a>
      <a href="/db" class="{{ 'active' if active == 'db' }}">Базы данных</a>
    </nav>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
